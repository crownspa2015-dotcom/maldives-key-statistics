<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maldives — Key Statistics</title>
<style>
:root{
  --ink:#0b1f4f;--muted:#60708c;--line:#dce6f0;--blue:#0877e8;--blue2:#78baf4;
  --teal:#169f8f;--teal2:#7fd3c6;--social:#eef6ff;--economic:#edf7ff;--env:#ecf8f5;
}
*{box-sizing:border-box} html,body{margin:0;overflow-x:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:white}
.wrap{padding:18px;max-width:1500px;margin:auto}
.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:18px;align-items:stretch;margin-bottom:18px}
.hero h1{font-size:44px;line-height:1.05;margin:0 0 10px;color:#11225d}
.hero p{font-size:16px;line-height:1.55;color:#36527c;margin:0}
.hero-note{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fbfdff}
.hero-note strong{display:block;font-size:28px;margin:4px 0}.hero-note span{font-size:12px;color:var(--muted)}
.section{border-radius:18px;padding:14px;margin:18px 0}
.social{background:var(--social)}.economic{background:var(--economic)}.environment{background:var(--env)}
.section-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.section-head h2{margin:0;font-size:27px}.section-head p{margin:0 0 0 auto;max-width:62%;font-size:13px;line-height:1.45;color:#416186;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card,.chart{background:white;border:1px solid rgba(11,52,112,.08);border-radius:12px;padding:14px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.card{display:flex;gap:12px;min-height:134px}.icon{font-size:24px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#e8f3ff;flex:0 0 42px}
.environment .icon{background:#dff4ef}
.label{font-size:12.5px;font-weight:700}.value{font-size:28px;font-weight:800;line-height:1.05;margin:6px 0;color:#10245d}
.unit{font-size:12px;font-weight:700;color:#46627f}.sub{font-size:12px;color:var(--muted);line-height:1.35}.source{font-size:10.5px;margin-top:8px;line-height:1.25}.source a{color:#496b94}
.visuals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.chart h3{font-size:19px;margin:0 0 4px}.chart-sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.donut-grid{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.donut{width:160px;height:160px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:34px;background:white;border-radius:50%}
.legend{display:grid;gap:10px}.legend-row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:12px}.sw{width:12px;height:12px;border-radius:3px}.legend-row strong{font-size:13px}
.bar-list{display:grid;gap:11px}.bar-row{display:grid;grid-template-columns:150px 1fr 76px;gap:10px;align-items:center;font-size:12px}.bar-track{height:18px;background:#edf2f7;border-radius:9px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#0b72df,#65b5f2);border-radius:9px}.environment .bar-fill{background:linear-gradient(90deg,#168f80,#75cfc2)}.bar-value{text-align:right;font-weight:800}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-box{border:1px solid #e2eaf2;border-radius:12px;padding:20px;text-align:center}.compare-box span{font-size:12px;color:#58708d;text-transform:uppercase}.compare-box strong{display:block;font-size:32px;margin-top:8px}
.footer{font-size:12px;color:#65758e;padding:8px 3px 20px}
@media(max-width:850px){.hero,.visuals{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.section-head p{max-width:none;text-align:left}.donut-grid{grid-template-columns:1fr}.bar-row{grid-template-columns:110px 1fr 65px}.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="wrap">Loading…</div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function source(x){return x.url?'<div class="source">Source: <a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.source)+'</a></div>':''}
function card(x){return '<div class="card"><div class="icon">'+esc(x.icon||"•")+'</div><div><div class="label">'+esc(x.label)+'</div><div class="value">'+esc(x.value)+'</div>'+(x.unit?'<div class="unit">'+esc(x.unit)+'</div>':'')+'<div class="sub">'+esc(x.subtitle||"")+'</div>'+source(x)+'</div></div>'}
function donut(c){
 const total=c.segments.reduce((a,b)=>a+Number(b.value),0)||1, cols=["#0b72df","#75baf1","#15998a","#77cfc1"];
 let cur=0,stops=c.segments.map((s,i)=>{let a=cur;cur+=s.value/total*100;return cols[i%cols.length]+" "+a+"% "+cur+"%"}).join(",");
 return '<div class="chart"><h3>'+esc(c.title)+'</h3><div class="chart-sub">'+esc(c.subtitle)+'</div><div class="donut-grid"><div class="donut" style="background:conic-gradient('+stops+')"></div><div class="legend">'+c.segments.map((s,i)=>'<div class="legend-row"><span class="sw" style="background:'+cols[i%cols.length]+'"></span><span>'+esc(s.label)+'</span><strong>'+esc(s.display||s.value)+'</strong></div>').join("")+'</div></div>'+source(c)+'</div>'
}
function bars(c,env=false){
 const max=Math.max(...c.items.map(x=>Number(x.value)))||1;
 return '<div class="chart"><h3>'+esc(c.title)+'</h3><div class="chart-sub">'+esc(c.subtitle)+'</div><div class="bar-list">'+c.items.map(x=>'<div class="bar-row"><span>'+esc(x.label)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(2,(Number(x.value)/max*100))+'%"></div></div><span class="bar-value">'+esc(x.display||x.value)+'</span></div>').join("")+'</div>'+source(c)+'</div>'
}
function compare(c){return '<div class="chart"><h3>'+esc(c.title)+'</h3><div class="chart-sub">'+esc(c.subtitle)+'</div><div class="compare">'+c.items.map(x=>'<div class="compare-box"><span>'+esc(x.label)+'</span><strong>'+esc(x.value)+'</strong></div>').join("")+'</div>'+source(c)+'</div>'}
function chart(c){if(c.type==="donut")return donut(c);if(c.type==="bar")return bars(c);if(c.type==="compare")return compare(c);return ""}
fetch("data.json?ts="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
 document.getElementById("app").innerHTML='<div class="hero"><div><h1>'+esc(d.meta.title)+'</h1><p>'+esc(d.meta.subtitle)+'</p></div><div class="hero-note"><span>Dashboard design</span><strong>'+esc(d.meta.indicatorThemes)+'</strong><span>focused indicator themes — below the 15-indicator maximum</span></div></div>'+
 d.sections.map(s=>'<section class="section '+esc(s.id)+'"><div class="section-head"><h2>'+esc(s.title)+'</h2><p>'+esc(s.strap)+'</p></div><div class="cards">'+s.cards.map(card).join("")+'</div><div class="visuals">'+s.charts.map(chart).join("")+'</div></section>').join("")+
 '<div class="footer">Official Maldives sources only · Updated '+esc(d.meta.lastUpdated)+'</div>';
}).catch(e=>{document.getElementById("app").innerHTML="<p>Could not load dashboard data.</p>"});
</script>
</body>
</html>
